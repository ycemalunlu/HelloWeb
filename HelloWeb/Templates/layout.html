{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>



        <nav class="navbar fixed-top navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body">
            <div class="container">
              <a class="navbar-brand"href="{% url 'home' %}">Navbar</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'projects' %}">Projects</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'me' %}">About Me</a>

                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'contact' %}">Contact</a>

                  </li>
                </ul>
              </div>
            </div>
          </nav>
      
    </header>

    <main class="mt-5">
                {% block content %}
                <!-- Content goes here -->
                {% endblock %}
    </main>
    
    <footer class="text-center mt-4">
        <p>&copy; 2025 Psyduck's Hello Web project</p>
    </footer>

    <!-- Add Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
